<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <div class="icon">&#9993;</div>
        <h1>We value your feedback</h1>
        <p class="subtitle">Tell us what you think. It only takes a minute.</p>

        <!-- Default method is POST; the second button overrides it with GET -->
        <form action="feedback" method="post" id="feedbackForm" novalidate>
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Jane Doe" maxlength="80" required>
                <span class="hint" data-for="name"></span>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required>
                <span class="hint" data-for="email"></span>
            </div>

            <div class="field">
                <label for="feedback">Your feedback</label>
                <textarea id="feedback" name="feedback" rows="5" maxlength="1000"
                          placeholder="Share your thoughts, suggestions or issues..." required></textarea>
                <span class="hint" data-for="feedback"></span>
                <span class="counter"><span id="count">0</span>/1000</span>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Submit (POST)</button>
                <button type="submit" class="btn btn-secondary" formmethod="get">Submit (GET)</button>
            </div>
            <p class="note">POST sends data in the request body. GET sends it in the URL.</p>
        </form>
    </main>
    <footer class="footer">&copy; 2026 Feedback Portal</footer>

    <script>
        const form = document.getElementById('feedbackForm');
        const fb = document.getElementById('feedback');
        const count = document.getElementById('count');
        fb.addEventListener('input', () => count.textContent = fb.value.length);

        const rules = {
            name: v => v.trim() ? '' : 'Please enter your name.',
            email: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? '' : 'Enter a valid email address.',
            feedback: v => v.trim().length >= 10 ? '' : 'Feedback must be at least 10 characters.'
        };

        form.addEventListener('submit', e => {
            let ok = true;
            for (const [id, check] of Object.entries(rules)) {
                const input = document.getElementById(id);
                const msg = check(input.value);
                document.querySelector('[data-for="' + id + '"]').textContent = msg;
                input.classList.toggle('invalid', !!msg);
                if (msg) ok = false;
            }
            if (!ok) e.preventDefault();
        });
    </script>
</body>
</html>
